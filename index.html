<!-- Font non bloccante: su un totem senza rete un <link> normale ritarda il
     primo render di ~12s. Fallback di sistema finche' Barlow non arriva. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"></noscript>

<style>
:root{
  /* Palette brand Sportlandia */
  --navy:#062c5c;
  --cobalt:#0d47a1;
  --blue:#1976d2;
  /* Versione di Natale: gli accenti ciano diventano oro. I nomi delle
     variabili restano quelli dell'originale, cosi' le regole non cambiano. */
  --cyan:#f2c14e;
  --cyan-soft:#ffe08a;
  --xmas-red:#c62828;
  --xmas-red-deep:#8e1414;
  --ink:#0a1c33;
  --paper:#ffffff;

  --font-display:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* Scala tipografica: 7 gradini, uno per ruolo. Nessun corpo fuori da questi.
     xs microtesto - sm etichette - md corpo - lg sommario - xl/2xl/3xl titoli.
     I tre breakpoint ridefiniscono i valori, non le regole che li usano. */
  --text-xs:.75rem;
  --text-sm:.9rem;
  --text-md:1.05rem;
  --text-lg:1.2rem;
  --text-xl:2rem;
  --text-2xl:2.5rem;
  --text-3xl:3rem;

  /* Interlettere: maiuscoletto spaziato entro il 5-12% leggibile.
     Sopra il 15% le parole si disgregano in lettere sciolte. */
  --tracking-caps:.12em;
  --tracking-wide:.08em;

  /* Scala di spaziatura: griglia da 4px. Ogni padding, margin e gap
     del layout e' un multiplo di --space-unit, mai un valore libero.
     I breakpoint cambiano solo l'unita': i rapporti restano identici. */
  --space-unit:4px;
  --space-1:calc(var(--space-unit) * 1);
  --space-2:calc(var(--space-unit) * 2);
  --space-3:calc(var(--space-unit) * 3);
  --space-4:calc(var(--space-unit) * 4);
  --space-5:calc(var(--space-unit) * 5);
  --space-6:calc(var(--space-unit) * 6);
  --space-7:calc(var(--space-unit) * 8);
  --space-8:calc(var(--space-unit) * 10);
  --space-9:calc(var(--space-unit) * 13);
  --space-10:calc(var(--space-unit) * 18);

  /* Altezze delle fasce fisse: le locandine si adattano a queste */
  --g:30px;                    /* spessore della ghirlanda-cornice */
  --chrome-top:135px;
  --chrome-bottom:270px;
  --footer-h:66px;

  --btn:58px;                  /* pulsanti e contatore: stessa altezza */
  --dur-fast:.22s;
  --ease-out:cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{color-scheme:dark}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--navy);
  color:#fff;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}

/* Sfondo ambientale: resta dietro alle locandine in formato 3:4 */
.ambient{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 60% at 50% 0%,rgba(242,193,78,.20),transparent 60%),
  linear-gradient(180deg,#04213f 0%,var(--navy) 40%,var(--cobalt) 100%);}
.ambient::after{content:'';position:absolute;inset:0;opacity:.5;
  background:radial-gradient(60% 40% at 50% 100%,rgba(25,118,210,.5),transparent 70%);}

/* ============ ACCESSIBILITA' ============ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:12px}

/* ============ HEADER ============ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:30;
  /* viewport-fit=cover e' dichiarato: senza env() il contenuto finirebbe
     sotto notch e barre di sistema quando non e' su un totem a cornice piena */
  padding:calc(var(--space-6) + var(--g) + env(safe-area-inset-top)) calc(var(--space-7) + env(safe-area-inset-right)) var(--space-9)
          calc(var(--space-7) + env(safe-area-inset-left));
  text-align:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,27,52,.94) 0%,rgba(6,44,92,.72) 46%,rgba(6,44,92,.18) 82%,transparent 100%);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
/* .42em spezzava "Infitness Castellammare" in lettere sciolte: da lontano
   si leggeva una sequenza, non una parola. Riportato nel 5-12%. */
.brand-kicker{
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:600;
  letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--cyan-soft);
  margin-bottom:var(--space-1);text-indent:var(--tracking-caps);
}
.brand-name{
  font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;
  letter-spacing:var(--tracking-caps);line-height:1;text-indent:var(--tracking-caps);
  background:linear-gradient(105deg,#fff 0%,#fff3cf 45%,var(--cyan-soft) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ============ PALCO / SLIDE ============ */
.stage{position:fixed;inset:0;z-index:10}
.deck{position:absolute;inset:0;perspective:2200px}

.slide{
  position:absolute;inset:0;
  visibility:hidden;opacity:0;
  will-change:transform,opacity;
}
/* Superficie cliccabile: un <button> vero sopra tutta la slide, cosi' gli
   orari si aprono anche da tastiera. Il testo resta fuori dal button
   (un <button> non puo' contenere <h2>) e lascia passare i click. */
.slide-hit{
  position:absolute;inset:0;z-index:3;
  border:0;background:none;padding:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.slide-hit:focus-visible{outline:5px solid var(--cyan);outline-offset:-14px;border-radius:0}
.slide-copy{pointer-events:none}

/* Se una locandina non carica, la slide non resta blu e muta */
.slide-fallback{
  display:none;position:absolute;inset:0;z-index:2;
  place-items:center;text-align:center;
  padding:var(--chrome-top) 12% var(--chrome-bottom);
}
.slide.no-img .slide-fallback{display:grid}
.slide.no-img .slide-media{display:none}
.slide-fallback h2{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;margin-bottom:var(--space-3)}
.slide-fallback p{font-size:var(--text-md);font-weight:300;color:rgba(255,255,255,.85)}

/* Tutte le slide, locandine e foto, hanno la stessa cornice 3:4 (il formato
   delle locandine), centrata nella fascia libera tra intestazione e controlli.
   La locandina ci sta per intero (contain); la foto la riempie (cover). */
.slide-media{
  position:absolute;top:var(--chrome-top);bottom:var(--chrome-bottom);left:var(--g);right:var(--g);
  display:grid;place-items:center;container-type:size;
}
.slide-box{
  position:relative;width:min(100cqw,75cqh);aspect-ratio:3/4;overflow:hidden;
  border-radius:10px;box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 2px rgba(255,224,138,.35);
}
/* browser senza container query: la cornice prende l'altezza disponibile */
@supports not (width:1cqw){ .slide-box{height:100%;width:auto} }
.slide-img{
  position:absolute;inset:0;
  background-repeat:no-repeat;background-position:center;background-size:cover;
  will-change:transform;
}
.slide[data-kind="poster"] .slide-img{background-size:contain}
/* Alone morbido dietro la cornice, la stacca dal fondo */
.slide-media::before{
  content:'';position:absolute;inset:-6%;z-index:-1;
  background:radial-gradient(60% 55% at 50% 50%,rgba(255,140,40,.25),transparent 72%);
}
/* Foto: velatura in basso per leggere il testo */
.slide[data-kind="photo"] .slide-box::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,transparent 35%,rgba(18,5,2,.55) 62%,rgba(18,5,2,.94) 96%);
}

/* Scritta natalizia in sovraimpressione su ogni immagine */
.xmas-ribbon{
  position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none;
  padding:var(--space-4) var(--space-4) var(--space-8);text-align:center;
  font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;
  /* su una riga sola: sui telefoni si rimpicciolisce con la cornice */
  font-size:min(calc(var(--text-2xl) * 1.05),6.4cqw);line-height:1.05;white-space:nowrap;color:#ffe08a;
  text-shadow:0 2px 4px rgba(0,0,0,.85),0 0 22px rgba(255,160,50,.65);
  background:linear-gradient(180deg,rgba(110,12,12,.88) 0%,rgba(110,12,12,.6) 55%,transparent 100%);
}
.xmas-ribbon span{color:#fff3cf;font-size:.7em;vertical-align:.18em;padding:0 .35em;opacity:.9}

/* ============ TESTO (solo slide foto) ============ */
.slide-copy{
  position:absolute;left:0;right:0;bottom:0;
  padding:0 var(--space-6) var(--space-6);z-index:2;
}
.slide[data-kind="poster"] .slide-copy{display:none}

.tag{
  display:inline-flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-5);margin-bottom:var(--space-4);
  background:linear-gradient(180deg,var(--xmas-red),var(--xmas-red-deep));color:#fff;border-radius:99px;
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  letter-spacing:var(--tracking-caps);text-transform:uppercase;
  box-shadow:0 6px 20px rgba(198,40,40,.5);
}
.slide-title{
  font-family:var(--font-display);font-size:var(--text-3xl);font-weight:700;
  line-height:.98;letter-spacing:.01em;margin-bottom:var(--space-3);
  text-shadow:0 6px 28px rgba(0,0,0,.85);
}
.slide-text{
  font-size:var(--text-lg);font-weight:300;line-height:1.45;max-width:640px;
  color:rgba(255,255,255,.93);margin-bottom:var(--space-6);
  text-shadow:0 2px 14px rgba(0,0,0,.85);
}
.cta{
  display:inline-flex;align-items:center;gap:var(--space-3);
  padding:var(--space-4) var(--space-6);border-radius:99px;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-family:var(--font-display);font-size:var(--text-md);font-weight:600;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;color:#fff;
}
.cta svg{width:22px;height:22px}

/* ============ CONTROLLI ============ */
.controls{
  position:fixed;left:0;right:0;bottom:calc(var(--footer-h,78px) + var(--g));z-index:40;
  padding:var(--space-4) calc(var(--space-6) + env(safe-area-inset-right)) var(--space-4) calc(var(--space-6) + env(safe-area-inset-left));
  background:linear-gradient(0deg,rgba(4,27,52,.82) 0%,rgba(6,44,92,.42) 62%,transparent 100%);
  pointer-events:none;
}
.controls>*{pointer-events:auto}

.rail{height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:var(--space-4)}
.rail-fill{height:100%;width:100%;transform:scaleX(0);transform-origin:left center;
  border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));
  box-shadow:0 0 14px rgba(242,193,78,.8)}

.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-4)}
.dot{
  width:30px;height:26px;padding:var(--space-2) 0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;
}
/* La larghezza sta qui e non in JS: il nodo <i> non va piu' ricreato a ogni
   cambio slide, altrimenti la transizione non ha un elemento su cui animare */
.dot i{display:block;width:60%;height:5px;border-radius:99px;
  background:rgba(255,255,255,.3);transition:background var(--dur-fast),width var(--dur-fast)}
.dot.is-on i{width:100%;background:var(--cyan);box-shadow:0 0 12px rgba(242,193,78,.75)}

.nav{display:flex;justify-content:center;align-items:center;gap:var(--space-4)}
/* --btn tiene pulsanti e contatore esattamente della stessa altezza */
.btn{
  width:var(--btn);height:var(--btn);border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:#fff;transition:background var(--dur-fast),transform var(--dur-fast),border-color var(--dur-fast);
}
.btn svg{width:calc(var(--btn) * .45);height:calc(var(--btn) * .45)}
.btn:hover,.btn:active{background:var(--cyan);border-color:var(--cyan);color:#3a2600;transform:scale(1.07)}
.counter{
  height:var(--btn);min-width:calc(var(--btn) * 1.85);flex-shrink:0;
  /* flex e non grid: con inline-grid "5", "/" e "12" finirebbero su tre righe */
  display:inline-flex;align-items:center;justify-content:center;gap:.22em;
  padding:0 calc(var(--btn) * .32);border-radius:99px;
  /* stessa superficie dei pulsanti: con un fondo piu' scuro dello sfondo la
     pillola sprofondava e sembrava piu' piccola, pur essendo alta uguale */
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  font-family:var(--font-display);font-weight:600;letter-spacing:.06em;
  font-size:calc(var(--btn) * .4);line-height:1;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.counter b{color:var(--cyan);font-size:calc(var(--btn) * .5)}

/* ============ FOOTER ============ */
.footer{
  position:fixed;left:var(--g);right:var(--g);bottom:var(--g);z-index:45;
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
  padding:var(--space-2) calc(var(--space-6) + env(safe-area-inset-right)) calc(var(--space-2) + env(safe-area-inset-bottom))
          calc(var(--space-6) + env(safe-area-inset-left));
  min-height:var(--footer-h);
  background:rgba(4,27,52,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid rgba(242,193,78,.3);
}
.f-name{font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  letter-spacing:var(--tracking-wide);color:var(--cyan);text-transform:uppercase}
.f-logo{
  flex-shrink:0;width:var(--logo,48px);height:var(--logo,48px);
  border-radius:50%;background:#fff;padding:calc(var(--logo,48px) * .1);display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 2px rgba(255,224,138,.45);
}
.f-logo img{width:100%;height:100%;object-fit:contain}
.f-rows{display:flex;flex-direction:column;gap:var(--space-1);flex:1 1 auto;min-width:0}
.f-row{display:flex;align-items:center;gap:var(--space-4);flex-wrap:nowrap;min-width:0;overflow:hidden;
  font-size:var(--text-xs);color:rgba(255,255,255,.84);white-space:nowrap}
/* L'indirizzo ha la sua riga: affiancato al telefono veniva tagliato a meta'
   parola, e su un totem l'indirizzo e' l'informazione che si va a leggere.
   text-overflow non agisce su un contenitore flex: il taglio, se resta,
   deve avvenire dentro .f-txt, che e' l'unico elemento di solo testo. */
.f-row>span{display:inline-flex;align-items:center;gap:var(--space-2);min-width:0}
.f-row>span:last-child{flex:0 0 auto}
.f-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row svg{width:13px;height:13px;flex-shrink:0;color:var(--cyan-soft)}
.f-hours{color:#fff;font-weight:500}
/* se l'orario va a capo, lo fa tra i due giorni e mai dentro un orario */
.nw{white-space:nowrap}
.f-brand{
  flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;
  text-decoration:none;padding:var(--space-1) var(--space-4);border-radius:99px;line-height:1.2;
  border:1px solid rgba(242,193,78,.34);background:rgba(242,193,78,.12);
  transition:background var(--dur-fast),transform var(--dur-fast);
}
/* .24em su un corpo da 9px rendeva "POWERED BY" illeggibile a distanza:
   sale al gradino xs e rientra nel tracking dei maiuscoletti */
.f-brand small{font-size:var(--text-xs);letter-spacing:var(--tracking-caps);
  text-transform:uppercase;color:rgba(255,255,255,.6)}
.f-brand strong{font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  letter-spacing:.05em;
  background:linear-gradient(105deg,var(--cyan),var(--cyan-soft));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ============ MODALE ORARI ============ */
.sheet{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:var(--space-7);
  background:rgba(2,14,28,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.sheet.open{display:grid}
.sheet-card{
  width:100%;max-width:620px;max-height:84vh;overflow:hidden;border-radius:28px;
  background:linear-gradient(180deg,#fff 0%,#f3f7fb 100%);color:var(--ink);
  display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.6);
}
.sheet-head{position:relative;padding:var(--space-7);color:#fff;
  background:linear-gradient(120deg,#0f4d2e,#1b6b3f)}
.sheet-head .tag{margin-bottom:var(--space-3)}
.sheet-title{font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;line-height:1.05}
.sheet-close{
  position:absolute;top:var(--space-5);right:var(--space-5);width:48px;height:48px;border-radius:50%;
  border:0;background:rgba(255,255,255,.94);color:var(--cobalt);
  display:grid;place-items:center;cursor:pointer;
  transition:transform var(--dur-fast),background var(--dur-fast);
}
.sheet-close svg{width:22px;height:22px}
.sheet-close:hover{background:var(--cyan);color:#fff;transform:rotate(90deg)}
.sheet-body{padding:var(--space-6) var(--space-7) var(--space-7);overflow-y:auto;overscroll-behavior:contain}
.sheet-label{
  display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5);
  font-family:var(--font-display);font-size:var(--text-md);font-weight:700;
  letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--cobalt);
}
.sheet-label svg{width:22px;height:22px;color:var(--cyan)}
.row{
  display:flex;gap:var(--space-5);padding:var(--space-4) var(--space-5);
  margin-bottom:var(--space-3);border-radius:14px;
  background:linear-gradient(120deg,#f7fafd,#e9f1f8);border-left:5px solid var(--cyan);
}
/* La colonna dei giorni si dimensiona sul corpo del testo, non su un px fisso:
   a 230px "Sabato" lasciava mezzo riquadro vuoto prima dell'orario */
.row dt{min-width:calc(var(--text-sm) * 8);font-weight:700;color:var(--cobalt);font-size:var(--text-sm)}
.row dd{flex:1;color:#37485c;font-size:var(--text-sm);font-weight:500}

/* ============ 42" — 1080x1920 ============ */
/* Non ripete piu' i corpi e le spaziature una per una: ridefinisce i token e
   tutte le regole seguono. Restano solo le misure fisiche dei componenti. */
@media (min-height:1600px){
  :root{
    --g:48px;--chrome-top:204px;--chrome-bottom:364px;--footer-h:88px;--logo:62px;--btn:86px;
    --space-unit:6px;
    --text-xs:1rem;--text-sm:1.25rem;--text-md:1.35rem;--text-lg:1.6rem;
    --text-xl:2.7rem;--text-2xl:3.6rem;--text-3xl:4.2rem;
  }
  .slide-text{max-width:860px}
  .cta svg{width:28px;height:28px}
  .rail{height:6px}
  .dot{width:44px;height:34px}
  .dot i{height:7px}
  .f-row svg{width:18px;height:18px}
  .sheet-card{max-width:820px}
}

/* ============ Mobile / anteprima ============ */
@media (max-width:520px){
  :root{
    --g:18px;--chrome-top:94px;--chrome-bottom:206px;--footer-h:60px;--btn:46px;
    --space-unit:3px;
    --text-xs:.62rem;--text-sm:.74rem;--text-md:.86rem;--text-lg:.95rem;
    --text-xl:1.5rem;--text-2xl:1.75rem;--text-3xl:1.9rem;
  }
  .dot{width:22px;height:22px}
  .dot i{height:4px}
  /* alla larghezza del telefono orario e numero non stanno sulla stessa riga:
     invece di troncare l'orario a meta', il numero va a capo */
  /* Footer in riga come sul totem: logo a sinistra, contatti al centro,
     bollino a destra. A questa larghezza i contatti non stanno su una riga:
     vanno a capo invece di essere troncati, e il bollino si compatta. */
  .footer{gap:var(--space-3);padding-left:var(--space-4);padding-right:var(--space-4)}
  .f-logo{width:42px;height:42px;padding:5px}
  .f-row{flex-wrap:wrap;row-gap:var(--space-1);white-space:normal}
  .f-row>span:last-child{flex:0 1 auto}
  .f-txt{white-space:normal}
  .f-brand{padding:var(--space-2) var(--space-3)}
  .f-brand strong{font-size:var(--text-xs)}
  .f-name{font-size:var(--text-xs);white-space:nowrap}
  .f-row{font-size:.58rem}
  .f-row svg{width:11px;height:11px}
  .f-brand small{font-size:.5rem}
  /* in colonna la chiave non deve piu' riservare la sua corsia */
  .row{flex-direction:column;gap:var(--space-1)}
  .row dt{min-width:0}
}


/* ============ SFONDO: VIDEO DEL CAMINO (video/camino.mp4) ============ */
/* Muto, in ciclo, senza audio nel file: i browser lo avviano da soli.
   Se il video non carica resta l'immagine fissa, e sotto il fondo scuro. */
.ambient .fire{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;
  background:#120502 url('video/camino.webp') center/cover no-repeat}
.has-fire .ambient{background:#120502}
.has-fire .ambient::after{display:none}
/* le fasce in alto e in basso diventano piu' leggere e calde: altrimenti
   coprirebbero proprio le zone in cui il fuoco si vede */
.has-fire .header{background:linear-gradient(180deg,rgba(18,5,2,.78) 0%,rgba(18,5,2,.42) 55%,transparent 100%);
  -webkit-backdrop-filter:none;backdrop-filter:none}
.has-fire .controls{background:linear-gradient(0deg,rgba(18,5,2,.72) 0%,rgba(18,5,2,.45) 62%,rgba(18,5,2,.1) 100%)}
.has-fire .dot i{background:rgba(255,255,255,.45)}
.has-fire .footer{background:rgba(18,6,3,.72)}

/* ================= NATALE ================= */
/* Ghirlanda-cornice: abete disegnato una volta su canvas (ricalcolato solo al
   resize), lucine in DOM animate solo in opacita' (costo GPU trascurabile).
   Sta sopra a tutto, modale compresa, e non intercetta mai i tocchi. */
.garland{position:fixed;inset:0;z-index:110;pointer-events:none}
.garland canvas{position:absolute;inset:0;width:100%;height:100%}
.garland .light{
  position:absolute;width:calc(var(--g) * .32);height:calc(var(--g) * .42);
  margin:calc(var(--g) * -.21) 0 0 calc(var(--g) * -.16);
  border-radius:50% 50% 46% 46%;background:var(--c);
  box-shadow:0 0 calc(var(--g) * .35) calc(var(--g) * .08) var(--c);
  animation:twinkle var(--t,2.4s) ease-in-out var(--d,0s) infinite alternate;
}
@keyframes twinkle{0%{opacity:1}55%{opacity:.85}100%{opacity:.25}}
.garland .bow{position:absolute;width:calc(var(--g) * 3);height:calc(var(--g) * 2.2);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}

/* Nevicata in sovraimpressione: sopra slide e controlli, sotto la modale
   (gli orari devono restare leggibili). Il canvas e' vuoto tra un episodio
   e l'altro e in quel tempo il ciclo di disegno e' fermo. */
.snow{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}

/* Pulsante musica: stesso stile dei pulsanti di navigazione */
.btn.is-muted{opacity:.6}

@media (prefers-reduced-motion:reduce){
  .garland .light{animation:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<body>

<div class="ambient" aria-hidden="true">

<canvas class="snow" id="snow" aria-hidden="true"></canvas>
<div class="garland" id="garland" aria-hidden="true"><canvas id="garlandCanvas"></canvas></div>
<template id="bowTpl"><svg viewBox="0 0 120 88" aria-hidden="true"><defs><linearGradient id="bowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e53935"/><stop offset="1" stop-color="#8e1414"/></linearGradient></defs><path d="M60 40C44 18 14 6 8 20c-6 15 12 34 52 22Z" fill="url(#bowG)"/><path d="M60 40C76 18 106 6 112 20c6 15-12 34-52 22Z" fill="url(#bowG)"/><path d="M56 44 34 84l12-4 8 8 6-40Zm8 0 22 40-12-4-8 8-6-40Z" fill="url(#bowG)"/><circle cx="60" cy="42" r="9" fill="#b71c1c"/><path d="M20 20c10-4 24 4 34 16M100 20c-10-4-24 4-34 16" stroke="#ff8a80" stroke-width="2.5" fill="none" opacity=".7"/></svg></template>

<p class="sr-only" aria-live="polite" id="live"></p>

<script src="vendor/gsap.min.js"></script>
<script>
(() => {
'use strict';

const COURSES = [
  { title:"Sala Attrezzi", tag:"Fitness", img:"images/sala-attrezzi.webp", poster:true,
    text:"Allenamento completo con macchinari isotonici, pesi liberi e cardio. Sala sempre aperta negli orari del centro.",
    hours:{ "Lun–Ven":"07:00–21:00", "Sabato":"08:00–12:00" } },

  { title:"Pilates Matwork", tag:"Pilates · Base / Intermedio / Avanzato", img:"images/pilates-matwork.webp", poster:true,
    text:"Pilates a corpo libero su tappetino. Tre livelli: Base, Intermedio e Avanzato. Migliora postura, equilibrio e forza del core.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"09:00 Intermedio · 11:00 Base · 16:00 Base · 18:00 Avanzato · 19:00 Intermedio · 20:00 Base",
            "Giorni pari (Mar · Gio)":"10:00 Base · 14:00 Base · 16:00 Base · 18:00 Intermedio" } },

  { title:"Pilates Reformer", tag:"Pilates", img:"images/pilates-reformer.webp", poster:true,
    text:"Pilates con il macchinario professionale Reformer. Allenamento personalizzato per tonificare e allungare la muscolatura.",
    hours:{ "Lun–Ven":"09:00–21:00", "Sabato":"09:00 · 10:00", "Info":"Prenotazione obbligatoria" } },

  { title:"Pilates Studio", tag:"Pilates · Su appuntamento", img:"images/pilates-studio.webp", poster:false,
    text:"Sessioni Pilates Studio con Cadillac, Barile e attrezzi avanzati. Lezioni individuali o duette su appuntamento.",
    hours:{ "Lun–Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"Pilates Tec Room", tag:"Pilates · Sala Tecnica", img:"images/pilates-tec-room.webp", poster:true,
    text:"Lezioni a orario fisso nella sala tecnica: Cadillac, Wunda Chair e grandi attrezzi per postura, mobilità e forza controllata.",
    hours:{ "Giorni pari (Mar · Gio)":"dalle 09:00 alle 17:00", "Turni":"09:00 · 10:00 · 11:00 · 12:00 · 14:00 · 15:00 · 16:00" } },

  { title:"Les Mills Shapes", tag:"Les Mills · Tonificazione", img:"images/lesmills-shapes.webp", poster:true,
    text:"45 minuti a basso impatto che fondono Pilates, sculpt e power yoga in un format fluido.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"10:00 · 17:00", "Giorni pari (Mar · Gio)":"20:00", "Sabato":"10:00" } },

  { title:"Les Mills Strength Development", tag:"Les Mills · Forza", img:"images/lesmills-strength.webp", poster:true,
    text:"Forza progressiva che costruisce muscoli e potenza. Bilancieri, dischi e peso del corpo, adatto a tutti i livelli.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"14:00", "Giorni pari (Mar · Gio)":"19:00" } },

  { title:"Les Mills Ceremony", tag:"Les Mills · X Hyrox", img:"images/lesmills-ceremony.webp", poster:true,
    text:"Funzionale di gruppo ad alta intensità: circuito di forza, cardio e agilità con bilancieri, kettlebell, vogatori e air bike.",
    hours:{ "Giorni dispari (Lun · Mer · Ven)":"15:00 · 17:00 · 20:00", "Giorni pari (Mar · Gio)":"14:00 · 17:00 · 18:00" } },

  { title:"Les Mills BodyBalance", tag:"Les Mills · Equilibrio", img:"images/lesmills-balance.webp", poster:true,
    text:"Yoga, Tai Chi e pilates per forza, flessibilità e mobilità. Riduce lo stress e favorisce il benessere mentale e fisico.",
    hours:{ "Giorni pari (Mar · Gio)":"08:00 · 17:00", "Sabato":"09:00" } },

  { title:"Orari Completi", tag:"Programmazione Settimanale", img:"images/orari.webp", poster:true,
    text:"Il quadro orario completo di tutte le sale e di tutti i corsi, giorno per giorno.",
    hours:{ "Apertura Lun–Ven":"07:00–21:00", "Apertura Sabato":"08:00–12:30", "Info e prenotazioni":"Tel. 081 871 8076" } },

  { title:"Fisiorehab 360", tag:"Riabilitazione", img:"images/fisiorehab.webp", poster:false,
    text:"Centro di fisioterapia e riabilitazione integrata. Programmi personalizzati per il recupero funzionale.",
    hours:{ "Lun–Ven":"Su appuntamento", "Sabato":"Su prenotazione", "Info":"Tel. 081 871 8076" } },

  { title:"GREENtosi", tag:"Eco-Wellness", img:"images/greentosi.webp", poster:false,
    text:"Il nostro impegno per la sostenibilità: impianto fotovoltaico, energia rinnovabile e iniziative eco-friendly.",
    hours:{ "Impegno":"Sportlandia è 100% green", "Energia":"Da fonti rinnovabili", "Iniziative":"Eventi periodici" } }
];

const DWELL = 7;                    // secondi di permanenza per slide
// Scorrimento automatico: tra una slide e l'altra lo schermo resta per
// qualche istante solo sul camino. Le slide escono, PAUSA secondi di
// camino, poi entra la successiva. Il tocco manuale non aspetta.
const PAUSA = 2.5;
const $ = id => document.getElementById(id);
const deck = $('deck'), dots = $('dots'), rail = $('rail'), live = $('live');
const sheet = $('sheet');

let slides = [], index = 0, dwell = null, flow = null;
let playing = true, onscreen = true, sheetOpen = false;

const reduce = matchMedia('(prefers-reduced-motion: reduce)');
// con "riduci movimento" il camino resta sull'immagine fissa
const fire = $('fire');
if (fire && reduce.matches) { fire.removeAttribute('autoplay'); fire.pause(); }
const D = () => reduce.matches ? 0 : 1;   // moltiplicatore durate

/* ---------- costruzione ---------- */
COURSES.forEach((c, i) => {
  const s = document.createElement('article');
  s.className = 'slide';
  s.dataset.kind = c.poster ? 'poster' : 'photo';
  s.setAttribute('aria-roledescription','slide');
  s.setAttribute('aria-label', `${i+1} di ${COURSES.length}: ${c.title}`);
  s.innerHTML =
    `<div class="slide-media"><div class="slide-box">` +
    `<div class="slide-img" style="background-image:url('${c.img}')"></div>` +
    `<p class="xmas-ribbon" aria-hidden="true"><span>✦</span>Buone Feste da Sportlandia<span>✦</span></p>` +
    (c.poster ? '' :
      `<div class="slide-copy">
         <p class="tag">${c.tag}</p>
         <h2 class="slide-title">${c.title}</h2>
         <p class="slide-text">${c.text}</p>
         <p class="cta" aria-hidden="true">Vedi orari
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
         </p>
       </div>`) +
    `</div></div>` +
    `<div class="slide-fallback"><h2>${c.title}</h2><p>${c.text}</p></div>` +
    `<button class="slide-hit" type="button" aria-label="Vedi gli orari di ${c.title}"></button>`;
  s.querySelector('.slide-hit').addEventListener('click', () => openSheet(i));
  deck.appendChild(s);
  slides.push(s);

  // un background-image non emette onerror: lo verifico a parte, cosi' una
  // locandina mancante mostra nome e descrizione invece di uno schermo blu
  const probe = new Image();
  probe.onerror = () => s.classList.add('no-img');
  probe.src = c.img;

  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', `Vai a ${c.title}`);
  d.innerHTML = '<i></i>';          // creato una volta sola, mai riscritto
  d.addEventListener('click', () => goTo(i, 'manual'));
  dots.appendChild(d);
});
$('tot').textContent = COURSES.length;

gsap.set(slides, { autoAlpha:0 });
gsap.set(slides[0], { autoAlpha:1 });
paint(false);
kenBurns(slides[0]);

/* ---------- transizioni ---------- */
// manuale = movimento direzionale (dice "avanti/indietro")
// automatica = dissolvenza ambientale (non simula un gesto che nessuno ha fatto)
function transition(to, mode, dir) {
  if (flow) flow.kill();
  const from = slides[index], next = slides[to];
  gsap.killTweensOf([from, next]);
  // una transizione interrotta (tocco durante la pausa) non deve lasciare
  // slide a mezza opacita': tutte le altre si nascondono subito
  slides.forEach(sl => { if (sl !== from && sl !== next) { gsap.killTweensOf(sl); gsap.set(sl, { autoAlpha:0 }); } });

  index = to;
  paint(mode === 'manual');

  if (!D()) {                      // reduced motion: stato finale, nessun moto
    gsap.set(from, { autoAlpha:0, xPercent:0, scale:1 });
    gsap.set(next, { autoAlpha:1, xPercent:0, scale:1, zIndex:2 });
    startDwell();
    return;
  }

  gsap.set(next, { zIndex:2 });
  gsap.set(from, { zIndex:1 });
  flow = gsap.timeline({ onComplete(){ gsap.set(from,{ autoAlpha:0 }); startDwell(); } });

  if (mode === 'manual') {
    gsap.set([from, next], { y:0 });
    flow.fromTo(next, { autoAlpha:1, xPercent:100*dir, scale:1.05 },
                      { xPercent:0, scale:1, duration:.85, ease:'expo.inOut' }, 0)
        .to(from,     { xPercent:-26*dir, scale:.94, autoAlpha:0, duration:.85, ease:'expo.inOut' }, 0);
  } else {
    // esce: si allontana e svanisce, lasciando il camino
    // pausa: solo camino per PAUSA secondi
    // entra: arriva da vicino e dal basso, come se si posasse sullo schermo
    const OUT = 1.1, IN = 1.4;
    gsap.set(next, { autoAlpha:0, xPercent:0 });
    flow.to(rail, { scaleX:0, duration:OUT, ease:'power2.in' }, 0)
        .to(from, { autoAlpha:0, scale:.9, y:-30, duration:OUT, ease:'power2.in' }, 0)
        .fromTo(next, { autoAlpha:0, scale:1.12, y:60 },
                      { autoAlpha:1, scale:1, y:0, duration:IN, ease:'power3.out' }, OUT + PAUSA)
        .set(from, { scale:1, y:0 });
  }

  // il testo entra dopo l'immagine, mai insieme: si legge una cosa alla volta
  const copy = next.querySelectorAll('.tag,.slide-title,.slide-text,.cta');
  if (copy.length) {
    flow.fromTo(copy, { autoAlpha:0, y:26 },
      { autoAlpha:1, y:0, duration:.55, stagger:.07, ease:'power2.out' },
      mode === 'manual' ? .3 : 1.1 + PAUSA + .5);
  }
  kenBurns(next);
}

// Ken Burns solo sulle foto: su una locandina sposterebbe il testo stampato
function kenBurns(slide) {
  const img = slide.querySelector('.slide-img');
  gsap.killTweensOf(img);
  if (slide.dataset.kind !== 'photo' || !D()) { gsap.set(img,{ scale:1, x:0, y:0 }); return; }
  gsap.fromTo(img, { scale:1.02, x:0, y:0 },
    { scale:1.1, x:'1.5%', y:'-1.2%', duration:14, ease:'sine.inOut', repeat:-1, yoyo:true });
}

// announce=false sullo scorrimento automatico: annunciare ogni 7 secondi
// all'infinito rende lo screen reader inascoltabile
function paint(announce) {
  $('cur').textContent = index + 1;
  dots.querySelectorAll('.dot').forEach((d,i) => {
    const on = i === index;
    d.classList.toggle('is-on', on);
    on ? d.setAttribute('aria-current','true') : d.removeAttribute('aria-current');
  });
  if (announce) live.textContent = `${index+1} di ${COURSES.length}: ${COURSES[index].title}`;
}

/* ---------- avanzamento automatico ---------- */
// un solo timer, ed e' la barra stessa: cosi' non possono desincronizzarsi
function startDwell() {
  stopDwell();
  if (!playing || sheetOpen || !onscreen || document.hidden) { gsap.set(rail,{scaleX:0}); return; }
  dwell = gsap.fromTo(rail, { scaleX:0 },
    { scaleX:1, duration:DWELL, ease:'none', onComplete:() => goTo((index+1)%COURSES.length,'auto') });
}
function stopDwell(){ if (dwell) { dwell.kill(); dwell = null; } }

function goTo(to, mode) {
  if (to === index) return;
  const total = COURSES.length;
  const dir = mode === 'auto' ? 1
            : ((to - index + total) % total) <= ((index - to + total) % total) ? 1 : -1;
  transition(to, mode, dir);
}
const step = n => goTo((index + n + COURSES.length) % COURSES.length, 'manual');

function setPlaying(on) {
  playing = on;
  $('icoPlay').style.display = on ? 'none' : 'block';
  $('icoPause').style.display = on ? 'block' : 'none';
  $('toggle').setAttribute('aria-label',
    on ? 'Metti in pausa lo scorrimento automatico' : 'Riprendi lo scorrimento automatico');
  on ? startDwell() : (stopDwell(), bumpIdle());
}

/* ---------- pannello orari ---------- */
// inert sul resto della pagina: senza, con Tab il focus scivolava sui
// pallini dietro l'overlay mentre la modale era aperta
const BEHIND = ['.header','.stage','.controls','.footer'].map(s => document.querySelector(s));
let lastFocus = null;

function openSheet(i) {
  sheetOpen = true; stopDwell(); bumpIdle();
  const c = COURSES[i];
  $('sheetTag').textContent = c.tag;
  $('sheetTitle').textContent = c.title;
  $('sheetRows').innerHTML = Object.entries(c.hours)
    .map(([k,v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  lastFocus = document.activeElement;
  BEHIND.forEach(el => el && el.setAttribute('inert',''));
  sheet.classList.add('open');
  $('sheetClose').focus();
  if (D()) {
    gsap.fromTo('.sheet-card', { y:44, scale:.96, autoAlpha:0 },
      { y:0, scale:1, autoAlpha:1, duration:.45, ease:'back.out(1.4)' });
    gsap.fromTo('.sheet-body .row', { autoAlpha:0, x:-18 },
      { autoAlpha:1, x:0, duration:.35, stagger:.06, delay:.18, ease:'power2.out' });
  }
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  sheet.classList.remove('open');
  BEHIND.forEach(el => el && el.removeAttribute('inert'));
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
  startDwell();
}

/* ---------- ritorno allo stato di riposo ---------- */
// Un totem non e' presidiato: chi apre gli orari o mette in pausa e se ne va
// lascerebbe lo schermo bloccato li' a tempo indeterminato. Dopo IDLE secondi
// senza tocchi si torna da soli alla prima slide, in riproduzione.
const IDLE = 60;
let idleTimer = null;

function attract() {
  closeSheet();
  if (!playing) setPlaying(true);
  if (index !== 0) goTo(0, 'auto');
}
function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(attract, IDLE * 1000);
}
// solo interazione umana: l'avanzamento automatico non conta come attivita'
['pointerdown','touchstart','keydown'].forEach(ev =>
  addEventListener(ev, bumpIdle, { passive:true, capture:true }));

/* ---------- eventi ---------- */
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('toggle').addEventListener('click', () => setPlaying(!playing));
$('sheetClose').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if (sheetOpen) return;
  if (e.key === 'ArrowLeft')  step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === ' ')          { e.preventDefault(); setPlaying(!playing); }
});

// swipe
let x0 = null;
deck.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive:true });
deck.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 56) step(dx < 0 ? 1 : -1);
}, { passive:true });

// niente lavoro a schermo spento o fuori vista
document.addEventListener('visibilitychange', () => document.hidden ? stopDwell() : startDwell());
new IntersectionObserver(([e]) => { onscreen = e.isIntersecting; onscreen ? startDwell() : stopDwell(); })
  .observe(deck);
reduce.addEventListener('change', () => { stopDwell(); startDwell(); });

startDwell();
bumpIdle();
})();
</script>
<!-- Natale: ghirlanda, neve e musica. File a parte: se manca, il totem gira lo stesso -->
<script src="natale.js"></script>
