name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione per volta. Non annulla quella in corso: a meta'
# strada lascerebbe il totem su una versione incompleta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Niente actions/configure-pages: serve solo ai generatori di siti
      # statici per calcolare il base path, qui il sito e' gia' statico.
      # In piu' al primo giro tentava di creare il sito Pages e falliva:
      # il token di Actions puo' pubblicare su Pages, non accenderlo.
      # Pages si accende una volta sola dalle impostazioni del repository
      # (Settings -> Pages -> Source: GitHub Actions).

      # Il sito e' la radice del repository: index.html, images/, vendor/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
