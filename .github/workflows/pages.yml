name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione per volta. Non annulla quella in corso: a meta'
# strada lascerebbe il totem su una versione incompleta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true accende Pages al primo giro, senza passare
      # dalle impostazioni del repository a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Il sito e' la radice del repository: index.html, images/, vendor/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
